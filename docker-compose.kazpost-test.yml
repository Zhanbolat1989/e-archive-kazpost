# ════════════════════════════════════════════════════════════════════════
#  Тестовая среда АО «Казпочта» (ТС-176 п. 4.11; требования ИБ: «все
#  обновления информационной системы должны проходить испытания в тестовой
#  среде до установки в промышленную среду»).
#
#    cp .env.kazpost.example .env.kazpost-test   # свои секреты, не промышленные
#    docker compose --env-file .env.kazpost-test \
#      -f docker-compose.yml -f docker-compose.kazpost.yml -f docker-compose.kazpost-test.yml \
#      up -d --build
#
#  Другое имя проекта — значит свои тома и своя сеть: данные тестовой среды не
#  пересекаются с промышленными. Порты веб-входа смещены, чтобы обе среды
#  могли работать на одном сервере; по памяти это ~2× базового стенда, поэтому
#  для тестовой среды обычно отключают ИИ-ассистента (EDITION_DISABLED_MODULES=search).
# ════════════════════════════════════════════════════════════════════════
name: earchive-kazpost-test

services:
  backend:
    # Тестовая среда не читает промышленный .env: ни секреты, ни SMTP.
    env_file: !override
      - .env.kazpost-test

  frontend:
    ports: !override
      - "8080:80"
      - "8443:443"

  # Копии тестовой среды — в свой каталог (BACKUP_DIR в .env.kazpost-test).
  backup-db:
    env_file: !override
      - .env.kazpost-test
