[pytest]
testpaths = tests
# Пакет приложения лежит рядом с tests/ — добавляем корень в путь импорта,
# иначе `from app...` не разрешается при запуске из каталога backend.
pythonpath = .
python_files = test_*.py
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
