# Промышленный контур: HTTPS (требования ИБ ТС-176 — SSL-сертификат от
# доверенного удостоверяющего центра). Сертификат и ключ монтируются в
# /etc/nginx/certs: fullchain.pem и privkey.pem.

server {
    listen 80;
    server_name _;

    # Проба живости контейнера — без перенаправления на HTTPS: внутри
    # контейнера сертификат выдан не на 127.0.0.1, и проверка падала бы.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Пакеты оцифровки принимаются модулем импорта до 2 ГБ.
    client_max_body_size 2100m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Заголовок ПЕРЕЗАПИСЫВАЕТСЯ адресом соединения, а не дополняется:
        # backend в этом контуре доверяет X-Forwarded-For (TRUST_PROXY_HEADERS),
        # и присланный клиентом адрес не должен попасть в аудиторский след.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        # Большие пакеты передаются потоком, а не копятся на диске nginx.
        proxy_request_buffering off;
    }
}
