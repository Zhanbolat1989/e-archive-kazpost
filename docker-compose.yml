# ════════════════════════════════════════════════════════════════════════
#  MEMORY BUDGET (host has 16 GB, shared with the RAGApp stack).
#  Every service has a `mem_limit` ceiling: without one, a single runaway
#  container starves the WSL2 VM and the Linux OOM killer picks a victim at
#  random — that is how `opensearch` died with exit 137 before.
#  Core services (no profile) sum to ~10.5 GB, leaving Windows ~4 GB.
#  Limits are ceilings, not reservations: normal usage sits far below.
#  NOTE: this stack and RAGApp each fit alone, but NOT simultaneously —
#  stop one before starting the other.
# ════════════════════════════════════════════════════════════════════════
services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    # JVM heap is pinned to 512m below; the rest is JVM overhead + Lucene
    # off-heap (mmap'd segments), so the container ceiling must exceed the heap.
    mem_limit: 1536m
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    mem_limit: 2g            # clamd holds the full signature DB resident (~1.5 GB)
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 5 localhost 3310 | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # Weights live in VRAM (GPU offload); host RAM only holds the loader and
    # KV overhead. 4g covers a CPU-fallback model load without going wild.
    mem_limit: 4g
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"
    # GPU acceleration (NVIDIA). Requires Docker Desktop + WSL2 + NVIDIA driver.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama --version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Распознавание документов: baidu/Unlimited-OCR (VLM) через OpenAI-совместимый
  # API vLLM. Требует NVIDIA GPU. Модель делит видеопамять с ollama, поэтому
  # сервис вынесен в профиль: `docker compose --profile ocr up -d ocr`.
  # Без него backend автоматически откатывается на Tesseract.
  ocr:
    image: vllm/vllm-openai:unlimited-ocr
    profiles: ["ocr"]
    mem_limit: 8g            # vLLM host-side buffers while the 3B VLM loads
    command: >
      --model baidu/Unlimited-OCR
      --served-model-name Unlimited-OCR
      --trust-remote-code
      --max-model-len 32768
      --gpu-memory-utilization ${OCR_GPU_FRACTION:-0.45}
      --host 0.0.0.0 --port 10000
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hfcache:/root/.cache/huggingface
    ports:
      - "10000:10000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # python, а не curl: curl в образе vllm-openai не гарантирован
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:10000/v1/models',timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 600s
    restart: unless-stopped

  backend:
    build: ./backend
    mem_limit: 2g            # document processing + local model cache
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      ollama: { condition: service_started }
    ports:
      - "8001:8000"
    volumes:
      - modelcache:/root/.cache
    restart: unless-stopped

  frontend:
    build: ./frontend
    mem_limit: 128m
    depends_on:
      - backend
    ports:
      - "3001:80"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  osdata:
  modelcache:
  ollamadata:
  hfcache:
